[[redirects]]
  from = "/welcome"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline hardening headers, added in the Sep 11 security review.
#
# Content-Security-Policy-Report-Only is deliberately report-only, not
# enforced, for this first pass. It allows exactly what the app actually
# needs (Stripe Elements/Stripe.js, the Google Fonts import in GlobalStyles,
# base64/data: images, canvas/Web-Share blobs) based on reading the code,
# but nothing here was verified by loading the live site. Watch the browser
# console on trueherfjournal.com (checkout page especially) for
# "Content-Security-Policy-Report-Only" violation messages -- if there are
# none after normal use, switch this header's name to
# "Content-Security-Policy" (dropping "-Report-Only") to actually enforce it.
#
# Strict-Transport-Security uses a 6-month max-age rather than the common
# 2-year one, and deliberately leaves out "preload" -- submitting to
# browsers' HSTS preload list is hard to reverse quickly if anything about
# hosting ever needs to change. Both can be strengthened later once this
# has run cleanly for a while.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
